spring.application.name=FwaltNews

spring.datasource.url = jdbc:postgresql://localhost:5432/fwaltnewsdb
spring.datasource.username = postgres
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driverClassName = org.postgresql.Driver
spring.jpa.database-platform = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.baseline-on-migrate=true
spring.profiles.active = ${SPRING_PROFILES_ACTIVE:dev}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.pathmatch.matching-strategy=ant-path-matcher

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.security.oauth2.client.registration.google.client-name=FwaltNews
spring.security.oauth2.client.registration.github.client-name=FwaltNews

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.openapi.server-url=https://api.fwaltnews.com
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs

newsdata.api.key=${NEWSDATA_API_KEY}
newsdata.api.source-url=https://newsdata.io/api/1/latest
newsdata.api.redirect-url=http://localhost:3000/v1/news
spring.task.scheduling.pool.size=2

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
app.ai.max-history-turns=5

gemini.api-key=${GEMINI_API_KEY}
gemini.embedding-model=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.observations.key-values.application=fwaltnews

news.scheduler.embed-missing=0 0 1 * * *
news.scheduler.purge-old=0 0 23 * * *
news.scheduler.fetch-rate-ms=86400000

cors.allowed-origins=http://localhost:3000,http://localhost:8080


