plugins {
    alias(libs.plugins.sonarqube)
    alias(libs.plugins.jacoco)
    alias(libs.plugins.spotless) apply false
}

sonar {
    properties {
        property "sonar.projectKey", "Fwalt237_FwaltNews"
        property "sonar.organization", "fwalt237"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.jacoco.xmlReportPaths",
                "${rootProject.projectDir}/module-repository/build/reports/jacoco/test/jacocoTestReport.xml," +
                        "${rootProject.projectDir}/module-service/build/reports/jacoco/test/jacocoTestReport.xml," +
                        "${rootProject.projectDir}/module-web/build/reports/jacoco/test/jacocoTestReport.xml"
    }
}

wrapper {
    gradleVersion = gradlewVersion
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    group = 'com.mjc.school'
    version = '1.0-SNAPSHOT'

    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
        maven { url 'https://repo.spring.io/snapshot' }
    }

    jacoco {
        toolVersion = "${libs.versions.jacoco.get()}"
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }

    plugins.withId('org.springframework.boot') {
        bootJar {
            enabled = false
        }
    }

    jar {
        enabled = true
    }

    tasks.withType(Checkstyle) {
        enabled = false
    }

    dependencies {
        testImplementation platform(libs.junit.bom)
        testImplementation libs.junit.jupiter
        testImplementation libs.archunit.junit5
        testImplementation libs.spring.boot.starter.test

        testImplementation libs.rest.assured
        testImplementation libs.rest.assured.json.path
        testImplementation libs.rest.assured.xml.path

        testImplementation libs.spring.security.test

        testRuntimeOnly libs.junit.platform.launcher

        implementation libs.bundles.spring.boot.starters

        implementation libs.jjwt.api
        runtimeOnly libs.jjwt.impl
        runtimeOnly libs.jjwt.jackson

        annotationProcessor libs.spring.boot.configuration.processor

        implementation libs.springdoc.openapi.starter.webmvc.ui

        implementation libs.caffeine

        implementation platform(libs.spring.ai.bom)
        implementation libs.pgvector
        implementation libs.spring.ai.starter.model.google.genai

        testImplementation platform(libs.testcontainers.bom)
        testImplementation libs.spring.boot.testcontainers
        testImplementation libs.testcontainers.junit.jupiter
        testImplementation libs.testcontainers.postgresql

        implementation libs.micrometer.registry.prometheus

        implementation libs.shedlock.spring
        implementation libs.shedlock.provider.jdbc.template

    }

    configurations {
        testImplementation {
            exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        }
    }

    test {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    check {
        dependsOn = [
                test,
                checkstyleMain,
        ]
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs = [
                "-Xlint:deprecation",
                "-Xlint:unchecked",
                "-parameters",
        ]
    }

    spotless {
        java {
            googleJavaFormat()
            removeUnusedImports()
        }
    }
}

tasks.named('sonar').configure {
    dependsOn subprojects.test
}