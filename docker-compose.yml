
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: fwaltnews_database_container
    env_file: .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=fwaltnewsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fwaltnews_backend_container
    env_file: .env
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/fwaltnewsdb
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH2_REDIRECT_URI=http://localhost:3000/v1/news
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - NEWSDATA_API_KEY=${NEWSDATA_API_KEY}

  frontend:
    build: ./frontend
    container_name: fwaltnews_frontend_container
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: fwaltnews_prometheus_container
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: fwaltnews_grafana_container
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
